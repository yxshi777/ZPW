<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao" crossorigin="anonymous"></script>
    <title>Document</title>

    <script>
        $(function(){
            $("#naPoczatek").click(function(){
                let value = $("input").val();
                if(!value.isEmpty){
                    $("ul").prepppend("<li>"+value+"</li>")
                    $("li").first().css("color","green")
                }
            });

            $("#naKoniec").click(function(){
                let value = $("input").val();
                if(!value.isEmpty){
                    $("ul").append("<li>"+value+"</li>")
                    $("li").last().css({
                        "color":"niebieski",
                        "font-weight" : "bold"
                    })
                }
            });
        });
    </script>

    <style>
        
    </style>
</head>
<body>
    <ul id="lista">
        <li>Chleb</li>
        <li>Mleko</li>
    </ul>

    <input type="text" id="produkt" placeholder="Nazwa produktu">
    <button id="naKoniec">Dodaj na koniec</button>
    <button id="naPoczatek">Dodaj na początek</button>
</body>
</html>
