<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>
        $(function(){
            $("#kolor").change(function(){
                $("body").css("background-color", $(this).val())
            });

            $("#rozmiar").change(function(){
                $("#rezultat").text("Do zapłaty: ", $(this).val())
            });

            $("#newsletter").change(function(){
                if(($this).is(":checked")){
                    $("#stan").text("Zapisano do newslettera")
                }else{
                    $("#stan").text("Nie zapisano do newslettera")
                }
            })

            $("#regulamin").change(function(){
                if(($this).is(":checked")){
                    $("#przyciskZarejestruj").prop("disabled", false)
                }else{
                    $("#przyciskZarejestruj").prop("disabled", true)
                }

                //$("#przyciskZarejestruj").prop("disabled", !$(this).is(":checked"))
            })

            $("#text").on("input", function(){
                $("#podglad").text($(this).val())
            })

            $("#pole").on("input", function(){
                let charLeft = 100 - $(this).val().lenth
            })
        })
    </script>
</head>
<body>
    <select id="kolor">
        <option value="white">Biały</option>
        <option value="yellow">Żółty</option>
        <option value="lightblue">Niebieski</option>
    </select>

    <hr>

    <h2>Wybierz rozmiar pizzy:</h2>
    <select id="rozmiar">
        <option value="20zl">Mała 20zł</option>
        <option value="30zl">Średnia 30zł</option>
        <option value="40zl">Duża 40zł</option>
    </select>
    <p id="rezultat">Do zapłaty: 0zl</p>

    <hr>

    <input type="checkbox" id="newsletter"> Newsletter
    <p id="stan"></p>

    <hr>

    <input type="checkbox" id="regulamin"> Akceptuje Regulamin
    <button type="submit" id="przyciskZarejestruj" disabled>Zarejestruj</button>

    <hr>

    <input type="text" id="text">
    <p>Podgląd: <span id="podglad"></span></p>

    <hr>

    <textarea maxlength="100" id="pole"></textarea>
    <p>Licznik: <span id="licznik"></span></p>

    <hr>
</body>
</html>
